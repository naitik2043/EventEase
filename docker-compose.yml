services:
  mongo:
    image: mongo:7.0
    container_name: eventease-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - eventease-mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand({ ping: 1 }).ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo-init.js:/scripts/mongo-init.js:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "mongosh mongodb://mongo:27017/admin --quiet --file /scripts/mongo-init.js &&
      until mongosh mongodb://mongo:27017/admin --quiet --eval 'db.hello().isWritablePrimary' | grep -q true;
      do sleep 1; done"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventease-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/eventease?replicaSet=rs0
    ports:
      - "5000:5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  eventease-mongo-data:
