services:
  mongo:
    image: mongo:7.0
    container_name: eventease-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - eventease-mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-replica-set.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { quit(db.hello().isWritablePrimary ? 0 : 1) } catch (error) { quit(1) }\""
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventease-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/eventease?replicaSet=rs0
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  eventease-mongo-data:
